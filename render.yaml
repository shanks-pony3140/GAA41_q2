services:
  - type: web
    name: rag-system
    env: python
    plan: free
    # Add debugging commands to see the build environment
    buildCommand: "pwd && ls -R && git submodule update --init --recursive && pip install -r rag_project/requirements.txt"
    startCommand: "gunicorn --chdir rag_project app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
