services:
  - type: web
    name: rag-system
    env: python
    plan: free
    # Build command is run from the repo root.
    # We initialize the submodule and then tell pip the full path to requirements.txt
    buildCommand: "git submodule update --init --recursive && pip install -r rag_project/requirements.txt"
    # Start command is also run from the repo root.
    # We use --chdir to tell gunicorn where to find the 'app.py' file.
    startCommand: "gunicorn --chdir rag_project app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9" # Using a specific patch version as required by Render
